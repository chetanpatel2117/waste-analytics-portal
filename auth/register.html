<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WasteMon - Register</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared-auth.js"></script>
    <link rel="stylesheet" href="register.css" />
</head>

<body class="bg-dark-main flex items-center justify-center h-screen">

    <div class="register-container">

        <!-- Logo Section -->
        <div class="flex flex-col items-center">
            <img src="../assets/logo.svg" class="w-14 mb-3" alt="logo" />
            <h2 class="text-xl font-semibold">WasteMon</h2>
            <h3 class="text-2xl font-bold mt-4">Create an Account</h3>
            <p class="text-gray-400 text-sm mt-1 mb-6">
                Join to start managing waste efficiently.
            </p>
        </div>

        <!-- Register Form -->
        <form id="registerForm">

            <div class="mb-4">
                <label class="label-text">Full Name</label>
                <div class="input-box">
                    <span class="icon">👤</span>
                    <input id="reg-fullname" name="fullname" type="text" placeholder="Alex Johnson" required />
                </div>
            </div>

            <div class="mb-4">
                <label class="label-text">Email Address</label>
                <div class="input-box">
                    <span class="icon">✉️</span>
                    <input id="reg-email" name="email" type="email" placeholder="you@example.com" required />
                </div>
            </div>

            <div class="mb-4">
                <label class="label-text">Password</label>
                <div class="input-box">
                    <span class="icon">🔒</span>
                    <input id="reg-password" name="password" type="password" placeholder="••••••••" required />
                </div>
            </div>

            <div class="mb-4">
                <label class="label-text">Confirm Password</label>
                <div class="input-box">
                    <span class="icon">🔒</span>
                    <input id="reg-password-confirm" name="password_confirm" type="password" placeholder="••••••••" required />
                </div>
            </div>

            <button class="btn-register" type="submit">Register</button>

            <p id="register-message" style="text-align:center; margin-top:8px; display:none;"></p>

            <p class="text-center text-gray-400 text-sm mt-4">
                Already have an account?
                <a href="login.html" class="text-green-400 font-medium hover:underline">Sign In</a>
            </p>

        </form>
    </div>

    <script src="register.js"></script>
</body>
</html>
