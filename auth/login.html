<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WasteMon - Login</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared-auth.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="login.css" />
</head>

<body class="bg-dark-main flex items-center justify-center h-screen">

    <div class="login-card">        

        <!-- Logo -->
        <div class="flex flex-col items-center mb-6">
            <img src="../assets/logo.svg" class="w-14 mb-3" alt="logo" />
            <h2 class="text-xl font-semibold">WasteMon</h2>
            <p class="text-gray-400 text-sm">Sign in to access your dashboard</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">

            <div class="mb-4">
                <label class="label-text">Username or Email</label>
                <div class="input-box">
                    <span class="icon">👤</span>
                    <input id="username" name="username" type="text" placeholder="username or email" required />
                </div>
            </div>

            <div class="mb-4">
                <label class="label-text">Password</label>
                <div class="input-box">
                    <span class="icon">🔒</span>
                    <input id="password" name="password" type="password" placeholder="••••••••" required />
                </div>
            </div>

            <div class="flex items-center justify-between text-sm mb-4">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input id="remember" type="checkbox" />
                    <span>Remember me</span>
                </label>

                <a href="#" class="text-green-400 hover:underline">Forgot Password?</a>
            </div>

            <button class="btn-login" type="submit">Sign In</button>

            <p id="login-error" style="color:#ff7777; text-align:center; margin-top:8px; display:none;"></p>

            <p class="text-center text-gray-400 text-sm mt-4">
                Don’t have an account?
                <a href="register.html" class="text-green-400 font-medium hover:underline">Register</a>
            </p>
        </form>

    </div>

    <script src="login.js"></script>
</body>
</html>
